[dotfiles]
"~/.local/bin/awake" = { source = "bin/awake", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/git/config" = { source = "git/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "git/ignore", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "tmux.conf", mode = "symlink" }
"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.config/ghostty" = { source = "ghostty", mode = "symlink" }
"~/.config/claude/CLAUDE.md" = { source = "claude/CLAUDE.md", mode = "symlink" }
"~/.config/claude/settings.json" = { source = "claude/settings.json", mode = "symlink" }
"~/.config/claude/scripts" = { source = "claude/scripts", mode = "symlink" }
"~/.config/claude/themes" = { source = "claude/themes", mode = "symlink" }
"~/.ssh/config" = { source = "ssh_config", mode = "symlink" }
"~/.zshrc" = { source = "zshrc", mode = "symlink" }

# Default required directories that need to exist for config to be in place.
[bootstrap.directories."~/.ssh"]
[bootstrap.directories."~/.local"]
[bootstrap.directories."~/.cache"]
[bootstrap.directories."~/.local/bin"]
[bootstrap.directories."~/.local/run"]
[bootstrap.directories."~/.local/share/less"]
[bootstrap.directories."~/.local/share/zsh"]

[bootstrap.packages]
"brew:gnupg" = "latest"
"brew:openssl@3.0" = "latest"
"brew-cask:ghostty" = "latest"

[shell_alias]
reload = 'source $HOME/.zshrc'
ls = 'ls -GoAhFD "%d/%m/%y %H:%M"'

[tasks.update_nvim]
description = "update neovim packages"
run = "nvim --headless --cmd \":lua vim.cmd('packupdate'); os.exit(0)\" && echo ''"

[tools]
jq = "latest"
neovim = "nightly"
mysql = "latest"
rg = "latest"
gh = "latest"
tmux = "latest"
claude-code = "latest"
rtk = "latest"
"github:fables-tales/rubyfmt" = "latest"
"gem:ruby-lsp" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = ["svelte@4.2.20"] }
rust-analyzer = "latest"
lua = "latest"
luajit = "latest"
stylua = "latest"
lua-language-server = "latest"
"npm:yaml-language-server" = "latest"
golangci-lint = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/nametake/golangci-lint-langserver" = "latest"
"github:zigtools/zls" = "latest"
"cargo:ebnfer" = "latest"
"arduino-cli" = "latest"
ruby = "3.4.10"
node = "26.7.0"
rust = "1.98.1"
go = "1.27.1"
zig = "0.16.0"
