[bootstrap.repos]
"~/workspace/dotfiles" = { url = "git@github.com:tanema/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config/git" = { source = "../git", mode = "symlink" }
"~/.config/tmux" = { source = "../tmux", mode = "symlink" }
"~/.config/nvim" = { source = "../nvim", mode = "symlink" }
"~/.config/claude/CLAUDE.md" = { source = "../claude/CLAUDE.md", mode = "symlink" }
"~/.config/claude/settings.json" = { source = "../claude/settings.json", mode = "symlink" }
"~/.config/claude/statusline-command.sh" = { source = "../claude/statusline-command.sh", mode = "symlink" }
"~/.config/zsh" = { source = "../zsh", mode = "symlink" }
"~/.ssh/config" = { source = "../ssh/config", mode = "symlink" }
"~/.zshrc" = { source = "../zsh/zshrc", mode = "symlink" }

[bootstrap.macos.dock]
autohide = true
tilesize = 75
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[shell_alias]
reload="source $HOME/.zshrc"
ls='ls -GoAhFD "%d/%m/%y %H:%M"'

[bootstrap.packages]
"brew:gnupg" = "latest"
"brew:openssl@3.0" = "latest"
"brew-cask:ghostty" = "latest"

[tools]
neovim = "nightly"
mysql = "latest"
rg = "15.2.0"
gh = "2.100.0"
tmux = "latest"
claude-code = "latest"
rtk = "latest"
ruby = "3.4.10"
"github:fables-tales/rubyfmt" = "latest"
"gem:ruby-lsp" = "latest"
node = "26.7.0"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = ["svelte@4.2.20"] }
rust = "1.98.1"
rust-analyzer = "latest"
lua = "latest"
luajit = "latest"
stylua = "latest"
lua-language-server = "latest"
"npm:yaml-language-server" = "latest"
go = "1.27.1"
golangci-lint = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/nametake/golangci-lint-langserver" = "latest"
zig = "0.16.0"
"github:zigtools/zls" = "0.16.0"
"cargo:ebnfer" = "latest"
"arduino-cli" = "latest"

[tasks.update_nvim]
description = "Automatically update neovim plugins using the builtin plugin manager"
run = "nvim --headless --cmd \":lua vim.cmd('packupdate'); os.exit(0)\""
 
# Default required directories that need to exist for config to be in place.
[bootstrap.directories."~/.ssh"]
[bootstrap.directories."~/.local"]
[bootstrap.directories."~/.cache"]
[bootstrap.directories."~/.local/bin"]
[bootstrap.directories."~/.local/run"]
[bootstrap.directories."~/.local/share/less"]
[bootstrap.directories."~/.local/share/zsh"]
